{% extends "_base.html" %}
{% load static %}
{% block title %}Ministres{% endblock title %}

{% block content %}
<div class="row">
  {% for ministre in ministres %}
  <div class="card mb-3" style="max-width: 540px;">
    <div class="col-md-4">
      <img src="{{ministre.photo.url}}" class="img" alt="...">
    </div>
    <div class="card-body">
      <h5 class="card-title"> {{ ministre.Nom }} </h5>
      <p class="card-text">contact : {{ ministre.contact }}</p>
      <a href="{% url 'ThemeByMinister' ministre.id %}" class="text-white bg-blue-400 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
        Voir Sermons
      </a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock content %} <div class="row-min">
