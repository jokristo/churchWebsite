{% extends "_base.html" %}
{% load static %}

{% block title %}Requête invalide - WMB Tab{% endblock title %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-2xl mx-auto text-center">
        <div class="mb-8">
            <span class="text-8xl md:text-9xl font-black text-orange-100 select-none">400</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-4">Requête invalide</h1>
        <p class="text-gray-600 mb-8">
            La requête envoyée n'est pas valide. Veuillez vérifier l'URL et réessayer.
        </p>
        <a href="{% url 'home' %}"
            class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors shadow-lg hover:shadow-xl">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            Retour à l'accueil
        </a>
    </div>
</section>
{% endblock content %}
