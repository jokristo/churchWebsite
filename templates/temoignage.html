{% extends "base.html" %}
{% load static %}
{% block title %}Temoignages{% endblock title %}
{% block content %}
<style>
form{
    display: flex;
    flex-direction: column;
    align-items: center;
}
input, textarea{
    display: block;
    padding: .75rem;
    font-size: 1rem;
    border: 1px solid #ced4da;
    min-width: 600px;
    font-family: poppins;
}
label {
    display: inline-block;
    box-sizing: border-box;
    margin: 1rem 0;
}
.titretemoin{
display: flex;
justify-content: space-between;
text-decoration: none;
color: #838CFC;
}
#bot{
    background-color: #838CFC;
    color: #ffffff;
}
.titretemoin>a{
    text-decoration: none;
    font-family: poppins;
}
#tem{
    color: #f30303;
    font-weight: bold;
}

@media(max-width:600px){
    input, textarea{
    display: block;
    padding: .200rem;
    font-size: 0.8rem;
    border: 1px solid #ced4da;
    min-width: 200px;
    font-family: poppins;
}
.titretemoin{
display: flex;
justify-content: space-between;
text-decoration: none;
color: #838CFC;
font-size: small;
}

#tem{
    color: #f30303;
}

}

</style>
<div class="titretemoin">
    <a >Placer votre Temoignage Ici</a>
    <a href="/temoignagecontent/" id="tem">Voir tous les Temoignages</a>
</div>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ formute.as_p }}
        <input type="submit" id="bot" value="Enregistrer">
    </form>


{% endblock content %}
