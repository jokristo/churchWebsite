<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <style>
        /* Ajoutez votre CSS ici */
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f0f0f0;
}

#messages {
    height: 80vh;
    overflow-y: scroll;
    padding: 10px;
    border: 1px solid #ddd;
    margin-bottom: 10px;
    background-color: #fff;
}

#messageForm {
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
    background-color: #fff;
}

#messageInput {
    flex-grow: 1;
    margin-right: 10px;
    padding: 5px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

#messageForm input[type="submit"] {
    padding: 5px 10px;
    border: none;
    background-color: #007BFF;
    color: #fff;
    cursor: pointer;
}

#messageForm input[type="submit"]:hover {
    background-color: #0056b3;
}

    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <div id="messages"></div>
    <form id="messageForm">
        <input type="text" id="messageInput">
        <input type="submit">
    </form>
    <script>
        function refreshMessages() {
            $.get('/messages/', function(data) {
                $('#messages').empty();
                data['messages'].forEach(function(message) {
                    $('#messages').prepend('<p>' + message['content'] + '</p>');
                });
            });
        }

        $('#messageForm').on('submit', function(event) {
            event.preventDefault();
            $.post('/new_message/', {'content': $('#messageInput').val()}, function(data) {
                if (data['status'] === 'ok') {
                    $('#messageInput').val('');
                    refreshMessages();
                }
            });
        });

        setInterval(refreshMessages, 5000);
        refreshMessages();
    </script>
</body>
</html>
