<script>
    let isPaypalButtonRendered = false;

    function openDonationModal() {
        document.getElementById('donation-modal').classList.remove('hidden');
        // Force le rendu du bouton seulement s'il n'existe pas encore
        if (!isPaypalButtonRendered) {
            paypal.HostedButtons({
                hostedButtonId: "6KSXMQYQLNAPL",
            }).render("#paypal-container-6KSXMQYQLNAPL").then(() => {
                isPaypalButtonRendered = true;
            });
        }
    }

    function closeModal() {
        document.getElementById('donation-modal').classList.add('hidden');
    }

    // Gestion des filtres
    const yearSelect = document.getElementById('filter-year');
    const monthSelect = document.getElementById('filter-month');
    const items = document.querySelectorAll('.photo-item');

    function filterGallery() {
        const y = yearSelect.value;
        const m = monthSelect.value;
        items.forEach(item => {
            const matchY = (y === 'all' || item.dataset.year === y);
            const matchM = (m === 'all' || item.dataset.month === m);
            item.classList.toggle('hidden', !(matchY && matchM));
        });
    }

    yearSelect.addEventListener('change', filterGallery);
    monthSelect.addEventListener('change', filterGallery);
</script>
