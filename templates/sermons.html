{% extends "_base.html" %}
{% load static %}
{% block title %}sermons{% endblock title %}

<link rel="stylesheet" href="{% static 'css/styleend.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/bootstrap-icons/bootstrap-icons.css' %}">
<script src="{% static 'JS/bootstrap.min.js' %}"></script>
{% block content %}
<!--search bar-->
<form class="flex items-center max-w-sm mx-auto">
    <label for="simple-search" class="sr-only">Search</label>
    <div class="relative w-full">
        <input type="text" id="simple-search"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="chercher une Predication" name="recherche" required />
    </div>
    <button type="submit"
        class="p-2.5 ms-2 text-sm font-medium text-white bg-blue-700 rounded-lg border border-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
        <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
        </svg>
        <span class="sr-only">Search</span>
    </button>
</form>
<a class="text-center" href="{% url 'ViewTheme' %}"  style="color: rgb(29 78 216 / var(--tw-text-opacity, 1));  font-weight: 700;">Voir Par Thème <span><img src="" alt=""></span></a>

<!--content -->
<div class="flex-card">
      {% for sermon in dba %}
    <div class="class="flex-initial md:flex flex-col" id="sermon_id">
        <img class="card-img-top" src="{{ sermon.image.url }}" alt="Card image">
        <div class="">
          <h4 class="card-title">{{ sermon.orateur }} </h4>
          <p class="card-text">Prechée le {{ sermon.date }} </p>
          <p class="card-text"><audio src="{{ sermon.audio.url }}" controls style="width: 200px;"></audio></p>
          <a href="{{ sermon.audio.url }}" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Cliquer ici pour telecharger l'audio</a>
        </div>
    </div>
      {% endfor %}
</div>
{% endblock content %}
